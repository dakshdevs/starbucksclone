<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Now - Starbucks Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
    }

    /* Join Now Button */
    .join-now-btn {
      background-color: black;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      animation: floatBtn 2s ease-in-out infinite alternate;
    }

    @keyframes floatBtn {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Sidebar Panel */
    .sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      width: 400px;
      height: 100%;
      background-color: #fff;
      box-shadow: -4px 0 12px rgba(0,0,0,0.2);
      transition: right 0.4s ease-in-out;
      z-index: 9999;
      padding: 30px;
      overflow-y: auto;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar-content h2 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #333;
      text-align: center;
    }

    .line1, .line2 {
      background-color: #C0A062;
      height: 4px;
      margin: 5px auto;
    }

    .line1 {
      width: 100px;
    }

    .line2 {
      width: 60px;
    }

    .sub-heading {
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
      color: #444;
    }

    .join-now-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }

    .join-now-form input,
    .join-now-form select {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .join-now-form button {
      background-color: black;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .join-now-form button:hover {
      background-color: #333;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        padding: 20px;
      }

      .join-now-btn {
        font-size: 14px;
        padding: 8px 16px;
      }

      .sidebar-content h2 {
        font-size: 22px;
      }

      .sub-heading {
        font-size: 16px;
      }

      .join-now-form input,
      .join-now-form select {
        font-size: 15px;
      }

      .join-now-form button {
        font-size: 15px;
      }
    }

    @media (max-width: 450px) {
      .line1 {
        width: 80px;
      }

      .line2 {
        width: 50px;
      }

      .sidebar-content h2 {
        font-size: 20px;
      }

      .sub-heading {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Join Now Button -->
  <button onclick="toggleSidebar()" class="join-now-btn">Join Now</button>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-content">
      <span class="close-btn" onclick="toggleSidebar()">&times;</span>
      
      <!-- Heading and Lines -->
      <h2>JOIN NOW</h2>
      <div class="line1"></div>
      <div class="line2"></div>

      <!-- Subheading -->
      <div class="sub-heading">Join now and be a member of our Starbucks!</div>

      <!-- Form -->
      <form class="join-now-form">
        <input type="email" placeholder="Enter your Email" required />
        <input type="password" placeholder="Create a Password" required />

        <label for="payment">Choose Payment Method:</label>
        <select id="payment" required>
          <option value="">Select</option>
          <option value="credit">Credit Card</option>
          <option value="debit">Debit Card</option>
          <option value="paypal">PayPal</option>
          <option value="upi">UPI</option>
        </select>

        <button type="submit">Become a Member</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }
  </script>

</body>
</html>
